seed: 1337

paths:
  raw_dir: data/raw/nsclc_radiogenomics
  processed_dir: data/processed
  radgenome_dir: data/raw/radgenome_chest_ct   # optional grounding pretraining
  pathology_dir: data/raw/tcga_wsi             # roadmap (Q2): H&E whole-slide images
  runs_dir: runs
  ckpt_dir: checkpoints
  # Tracked in git, unlike runs/ and checkpoints/. One small JSON per run holding
  # the resolved config, every per-fold metric and the out-of-fold predictions —
  # enough to rebuild the pooled AUC, its CI and every ROC curve without weights.
  results_dir: results

data:
  modalities: [CT]             # roadmap: [CT, PATH] once the pathology branch lands
  modality_dropout: 0.0        # roadmap (Q2): prob of dropping one modality in training
  headline_genes: [EGFR]       # KRAS demoted: pooled 0.522 [0.400, 0.639], flat learning curve
  exploratory_genes: [KRAS]    # roadmap: + ALK, MET, BRAF, STK11, TP53 as prevalence allows
  target_genes: [EGFR, KRAS]   # = headline + exploratory once the panel is locked in Q1
  roi_margin_mm: 12            # dilation around seg mask before crop
  # Square crop side = (tumor bbox + 2*margin) * context_factor. At 1.0 the tumor
  # fills most of the frame, which caps how much any localization metric can mean:
  # watch grounding_*_shuffled in the eval output, since that chance baseline rises
  # with the tumor's area fraction. 2.0-3.0 makes grounding a real task, at the cost
  # of a smaller lesion in the input. Changing this changes the science — decide
  # deliberately, do not drift.
  context_factor: 2.5
  # Random offset of the crop centre, as a fraction of the crop side, seeded per
  # patient. At 0 the tumor sits at the exact centre of every crop (measured ROI
  # centroid 6.5 +/- 0.1 on a 14x14 grid whose centre is 6.5), which makes
  # grounding unlearnable — the answer is "the middle" for everyone. Grounding
  # lift was ~0.000 across four ablation arms until this was added.
  crop_jitter_frac: 0.30
  # Patients with an AIM annotation but no SEG get a fixed-size crop centred on
  # the annotated lesion centroid. AIM marks a location, not an extent, so there
  # is no bounding box to scale from. ~48 patients in NSCLC-RADIOGENOMICS are in
  # this tier and they carry mutation labels; including them takes EGFR positives
  # from 23 to 41. Their ROI is written as zeros and grounding is masked off for
  # them — no mask is invented.
  aim_crop_mm: 50.0
  # An AIM point landing in air means the annotation does not localise a lesion
  # on the slice we resolved. Measured: 4 of 43 (9%) fail this. Dropped rather
  # than snapped to nearby tissue, which would invent a location.
  aim_min_hu: -700.0
  slice_strategy: tumor_bbox   # tumor_bbox | max_area | all
  n_slices: 16                 # slices sampled through the tumor extent
  image_size: 224
  hu_window: [-600, 1500]      # lung window: center, width
  min_tumor_voxels: 50

# Multi-cohort training + sealed external test (roadmap Q1-Q3).
# Internal cohorts are pooled and k-folded; external stays unseen until the model freezes.
cohorts:
  internal: [nsclc_radiogenomics, tcga_luad, tcga_lusc, nsclc_radiomics]
  external: [collaborator_private]   # held out for generalization; never trained on

# Pathology branch (roadmap Q2). Frozen foundation-model backbone + MIL over tiles.
pathology:
  enabled: false
  backbone: uni                # uni | conch
  tile_size: 256
  tiles_per_slide: 256
  mil: attention               # attention-based multiple-instance aggregation

split:
  scheme: stratified_kfold     # patient-level, stratified on EGFR
  n_folds: 5
  stratify_on: EGFR
  # Nested splits: early stopping and checkpoint selection use an inner validation
  # set carved from the training portion, and the outer fold is scored once after
  # the model is frozen. Setting this false selects the checkpoint on the very
  # split it then reports, which biases every headline number upward.
  nested: true
  inner_val_frac: 0.2

model:
  vision_encoder: biomedclip   # biomedclip | timm_vit_b16 | open_clip_vit_b16
  vision_dim: 512
  freeze_vision: true          # measured: frozen 0.573 vs fine-tuned 0.426 at n=153
  # Blocks to re-enable when freeze_vision is true. Full freezing fixed the
  # classifier but left grounding lift at ~0.000 — the head can reweight fixed
  # features but cannot change what is attended. 0 = fully frozen.
  # Ablation on fold 0, jittered crops: fully frozen never grounds (lift -0.013,
  # pointing 0.00) no matter the loss weight. Unfreezing the last 2 blocks gives
  # lift +0.302 and pointing 1.00. Raising ground to 5.0 on top of that BREAKS it
  # again (lift -0.001) — more pressure is worse.
  unfreeze_last_n: 2
  lm_name: microsoft/BioGPT    # generation head backbone (swap for LLaVA-Med LM)
  lm_max_new_tokens: 96
  grounding_tokens: 8          # learned region queries for the grounding head
  classifier_hidden: 256
  dropout: 0.1
  # How the Q region embeddings collapse into the classifier's input.
  # The grounding loss supervises the element-wise MAX over queries, so only
  # "max" makes prediction and localization share the same evidence. "mean" is
  # the original behaviour and lets an unsupervised query feed the classifier.
  region_pooling: mean         # mean | max
  # Warm-start from theia.engine.pretrain (label-free cohorts: NSCLC-Radiomics
  # 421 masked patients). null = off, and off is the measured right answer.
  #
  # Pretraining itself works: val grounding lift +0.735, attention mass 16x its
  # shuffled baseline on held-out NSCLC-Radiomics patients. What it does NOT do
  # is help this cohort. Three full 5-fold runs, pooled EGFR / grounding lift:
  #   off (run 6)                  0.656 [0.560, 0.747]  +0.235, 4/5 folds
  #   vision+grounding (run 8)     0.528 [0.423, 0.633]  +0.749, 5/5 folds
  #   grounding head only (run 9)  0.597 [0.496, 0.696]  +0.235, 2/5 folds
  #
  # Transferring both buys near-perfect localisation and costs the entire
  # classification signal: pretraining adapts the ViT to a radiotherapy-planning
  # cohort's scanners, keeping "where is the dense thing" and losing the texture
  # that carries EGFR. Transferring the head alone is incoherent — the head was
  # fitted against pretrained features, and given BiomedCLIP's instead it
  # collapses to uniform attention in 3 of 5 folds (peak ratio 1.12, 1.13, 3.88
  # vs 43.1 and 31.3 in the two that survived). Run 9's mean lift matches run 6
  # only because two folds carry it; it is bimodal, not better.
  #
  # The encoder and the grounding head must move together or not at all, and
  # together they are worse. Set this only to reproduce runs 8/9.
  grounding_pretrain_ckpt: null
  # Only read when grounding_pretrain_ckpt is set. See above for why both
  # settings lose to no pretraining at all.
  warm_start_vision: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, v_proj]   # must match the chosen LM's attention names

train:
  device: auto                 # auto (cuda > mps > cpu) | cuda | mps | cpu
  num_workers: 2
  epochs: 40
  batch_size: 8                # 128 imgs/step at n_slices=16; drop to 2 on <32GB
  grad_accum: 2
  lr: 2.0e-4
  # Depends on whether grounding is being LEARNED or PRESERVED.
  #   no warm-start: 1.0. At 0.1 the blocks cannot move enough to learn to
  #     localise at all (lift +0.060 -> -0.001, folds grounding 2/5 -> 0/5).
  #   with grounding_pretrain_ckpt: 0.3. The blocks arrive already localising,
  #     so the full rate destroys it and 0.1 starves the classifier. Fold 0:
  #     mult 0.1 -> EGFR 0.484 / lift +0.810;  0.3 -> EGFR 0.663 / lift +0.798.
  # This value tracks grounding_pretrain_ckpt. It is 1.0 because that key is
  # null; setting the checkpoint without also setting 0.3 here reproduces
  # neither run 6 nor run 8/9.
  backbone_lr_mult: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.05
  amp: true                    # honoured on CUDA only; reported at startup
  loss_weights:
    cls: 1.0
    gen: 1.0
    ground: 0.5
  early_stop_patience: 8
  # One key, or several to be summed. Selecting on egfr_auc alone and then
  # reporting grounding means the grounding number comes from whichever epoch
  # won on AUC: fold 1 selected ep4 (lift +0.007) while its best grounding sat
  # at ep12 (+0.069). Weighted so AUC still leads.
  monitor: [[egfr_auc, 1.0], [grounding_mass_lift, 0.5]]

grounding_pretrain:
  enabled: false               # set true to pretrain grounding on RadGenome first
  # 3 was far too few: grounding needs ~10 epochs to move off chance even on the
  # labelled cohort, and a 2-epoch smoke test showed loss falling (3.89 -> 2.61)
  # with lift still at +0.000.
  epochs: 20
  lr: 2.0e-4   # 1e-4 plateaued at lift -0.007; the main run grounds at 2e-4

eval:
  bootstrap_n: 2000            # CI on AUC; final evaluation only, not per epoch

reader_study:
  n_cases: 32
  readers: 3
  blind: true
  arms: [theia_full, label_only, ground_truth]
