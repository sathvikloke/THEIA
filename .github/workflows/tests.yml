name: tests

# The suite is deliberately runnable with no TCIA data, no GPU and no model
# downloads: the heavyweight vision backbone and language model are stubbed, and
# every analysis test reads the archived results/*.json. That is what makes CI
# possible at all here, and it is worth keeping true.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU torch: the tests never touch a GPU and the CUDA wheels are ~2 GB.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Config must load and validate
        run: python -c "from theia.config import load_config; load_config('configs/default.yaml'); print('config ok')"
      - name: Analyses must reproduce from the archives alone
        run: |
          python -m theia.analysis.aggregate --pattern 'results/ms-s*.json' --out /tmp/a.json
          python -m theia.analysis.figures --outdir /tmp/figs
